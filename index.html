    <script>
        (function () {
            try {
                var pref = localStorage.getItem('theme');
                var dark = pref === 'dark' || (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme-pref', pref || 'system');
            } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ------------------------------------------------------------------
           Periscope design system. Hand-written, no framework.
           Tokens follow the Cove / Minn Admin contract: data-theme on <html>
           holds the effective mode, data-theme-pref the stored preference.
           ------------------------------------------------------------------ */
        :root {
            --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            --r-lg: 10px;
            --r-md: 6px;
            --r-sm: 4px;
            --r-pill: 999px;
            --wrap: 1180px;
            --topbar: 56px;
            --ease: cubic-bezier(.2, .7, .2, 1);
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0b1014;
            --bg-sunk: #070b0e;
            --panel: #10171d;
            --panel-2: #151e26;
            --hover: #1a242d;
            --line: #223039;
            --line-2: #33454f;
            --text: #e6edf1;
            --dim: #8e9da8;
            --faint: #5b6c77;
            --accent: #4fb5c6;
            --accent-2: #7fd0dd;
            --accent-fg: #06181c;
            --ok: #4ec78d;
            --warn: #e5b04e;
            --bad: #e8706f;
            --info: #6fa9ee;
            --purple: #b592ea;
            --shadow: 0 20px 60px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
            --shadow-sm: 0 6px 24px rgba(0, 0, 0, .45);
            --scrim: rgba(4, 8, 11, .72);
            --z-t: #7fd0dd; --z-cls: #8e9da8; --z-n: #e6edf1; --z-num: #e5b04e; --z-s: #b7d39a; --z-c: #5b6c77; --z-d: #b592ea;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #f4f7f8;
            --bg-sunk: #eaeff1;
            --panel: #ffffff;
            --panel-2: #f3f6f7;
            --hover: #edf2f4;
            --line: #d6dee3;
            --line-2: #b6c3ca;
            --text: #14212b;
            --dim: #5e6f7a;
            --faint: #97a5ad;
            --accent: #177d8c;
            --accent-2: #12616d;
            --accent-fg: #ffffff;
            --ok: #1f7a4c;
            --warn: #8a6314;
            --bad: #b14141;
            --info: #2c63a6;
            --purple: #6b4db0;
            --shadow: 0 20px 60px rgba(20, 33, 43, .18), 0 2px 8px rgba(20, 33, 43, .08);
            --shadow-sm: 0 6px 24px rgba(20, 33, 43, .12);
            --scrim: rgba(20, 33, 43, .45);
            --z-t: #12616d; --z-cls: #5e6f7a; --z-n: #14212b; --z-num: #8a6314; --z-s: #4f7d2a; --z-c: #97a5ad; --z-d: #6b4db0;
        }

        /* ---- reset ---- */
        *, *::before, *::after { box-sizing: border-box; }
        html { background: var(--bg); -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        }
        h1, h2, h3, h4, p { margin: 0; }
        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
        input, select { font: inherit; color: inherit; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; text-underline-offset: 2px; }
        code, pre, kbd, .mono { font-family: var(--font-mono); font-size: .93em; }
        ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

        /* ---- click to copy: any [data-ctx] value copies on click, right-click for more ---- */
        [data-ctx] { cursor: pointer; border-radius: 3px; }
        [data-ctx]:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
        [data-ctx].copied { background: color-mix(in srgb, var(--ok) 22%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
        td[data-ctx] { border-radius: 0; }
        td[data-ctx]:hover { background: var(--hover); box-shadow: none; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
        td[data-ctx].copied { box-shadow: none; }
        .table tbody tr:hover td { transition: none; }
        .copy-card { opacity: 0; transition: opacity .15s; }
        .card:hover .copy-card, .copy-card:focus-visible { opacity: 1; }
        @media (hover: none) { .copy-card { opacity: 1; } }
        .card-right { display: inline-flex; align-items: center; gap: 6px; }
        .sub-list { margin: 2px 0 6px 0; padding: 6px 10px; background: var(--bg-sunk); border: 1px solid var(--line); border-radius: var(--r-sm); display: flex; flex-direction: column; gap: 3px; }
        .sub-list code { font-size: 11.5px; overflow-wrap: anywhere; }
        .sub-list .more { font-size: 11px; color: var(--faint); }
        .row.stack-row { flex-direction: column; align-items: stretch; gap: 0; }
        .row > .row-main { display: flex; flex: 1; min-width: 0; align-items: center; justify-content: space-between; gap: 12px; }
        .report-page { margin-top: 8px; font-size: 13.5px; max-width: 72ch; }
        .report-page .pt { font-weight: 500; }
        .report-page .pd { color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .facts .v.mono[data-ctx] { display: inline-block; max-width: 100%; }

        /* ---- icons ---- */
        .ic { width: 1em; height: 1em; display: inline-block; vertical-align: -.15em; flex: none;
              stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .ic.fill { fill: currentColor; stroke: none; }
        .ic-lg { font-size: 20px; } .ic-xl { font-size: 40px; } .ic-2x { font-size: 64px; }

        /* ---- scrollbars ---- */
        .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
        .scroll::-webkit-scrollbar-thumb:hover { background: var(--faint); }
        .scroll { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

        /* ---- text utilities ---- */
        .dim { color: var(--dim); } .faint { color: var(--faint); }
        .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .info { color: var(--info); } .purple { color: var(--purple); } .accent { color: var(--accent); }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .break { overflow-wrap: anywhere; }
        .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
        .small { font-size: 12px; } .xs { font-size: 11px; }
        .num { font-variant-numeric: tabular-nums; }

        /* ---- top bar ---- */
        .topbar {
            position: sticky; top: 0; z-index: 40; height: var(--topbar);
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .topbar-inner { max-width: var(--wrap); margin: 0 auto; height: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; user-select: none; cursor: pointer; color: var(--text); }
        .brand:hover { text-decoration: none; }
        .brand-mark { width: 28px; height: 28px; display: block; color: var(--text); fill: none; stroke: currentColor; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
        .brand-name { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
        .topbar-actions { display: flex; align-items: center; gap: 4px; }

        .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: var(--r-pill); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); color: var(--dim); background: var(--panel); white-space: nowrap; }
        .pill-accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
        .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .pill .dot.live { box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); animation: breathe 2.4s ease-in-out infinite; }

        .icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: var(--r-md); color: var(--dim); transition: background .15s, color .15s; }
        .icon-btn:hover { background: var(--hover); color: var(--text); text-decoration: none; }
        .icon-btn .ic { font-size: 18px; }
        .icon-btn.sm { width: 28px; height: 28px; } .icon-btn.sm .ic { font-size: 15px; }
        .icon-btn:disabled { opacity: .35; cursor: default; }
        .icon-btn.danger:hover { color: var(--bad); }

        /* ---- layout ---- */
        .wrap { max-width: var(--wrap); margin: 0 auto; padding: 24px 20px 72px; }
        .stack > * + * { margin-top: 16px; }

        /* ---- hero / scan bar ---- */
        .hero { max-width: 760px; margin: 0 auto; transition: margin .5s var(--ease), max-width .5s var(--ease); position: relative; }
        .hero:has(.dropdown) { z-index: 30; }
        .hero.is-idle { margin-top: clamp(24px, 12vh, 120px); }
        .hero.is-idle .scanbar { height: 60px; }
        .hero-copy { text-align: center; margin-bottom: 22px; }
        .hero-copy h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
        .hero-copy p { color: var(--dim); margin-top: 8px; font-size: 15px; }

        .scanbar { position: relative; display: flex; align-items: center; height: 52px; padding: 0 6px 0 14px; gap: 8px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-lg); transition: border-color .15s, box-shadow .15s, height .4s var(--ease); }
        .scanbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
        .scanbar .lead { color: var(--faint); font-size: 20px; display: grid; place-items: center; }
        .scanbar:focus-within .lead { color: var(--accent); }
        .scan-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-family: var(--font-mono); font-size: 16px; color: var(--text); }
        .scan-input::placeholder { color: var(--faint); font-family: var(--font-sans); }

        .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: var(--r-md); font-weight: 500; font-size: 13.5px; border: 1px solid transparent; white-space: nowrap; transition: background .15s, color .15s, border-color .15s, opacity .15s; }
        .btn:disabled { opacity: .5; cursor: default; }
        .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
        .btn-ghost { background: transparent; color: var(--dim); border-color: var(--line); }
        .btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: var(--line-2); text-decoration: none; }
        .btn-soft { background: var(--panel-2); color: var(--text); border-color: var(--line); }
        .btn-soft:hover:not(:disabled) { background: var(--hover); border-color: var(--line-2); }
        .btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; gap: 5px; }
        .btn-xs { height: 24px; padding: 0 8px; font-size: 11.5px; gap: 4px; }
        .btn .ic { font-size: 15px; }
        .link { color: var(--accent); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
        .link-dim { color: var(--dim); } .link-dim:hover { color: var(--accent); text-decoration: none; }
        .link-dim.small { font-size: 12px; }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
        @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
        @keyframes pop { from { opacity: 0; transform: scale(.97) } to { opacity: 1; transform: none } }
        @keyframes slide-in { from { opacity: 0; transform: translateX(16px) } to { opacity: 1; transform: none } }
        .rise { animation: rise .35s var(--ease) both; }
        .pop { animation: pop .12s ease-out both; }

        .dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-md); box-shadow: var(--shadow-sm); overflow: hidden; z-index: 50; max-height: 300px; overflow-y: auto; }
        .dropdown-label { padding: 8px 12px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); }
        .dropdown ul { list-style: none; margin: 0; padding: 4px; }
        .dropdown li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; }
        .dropdown li:hover { background: var(--hover); }
        .dropdown li .d { font-family: var(--font-mono); font-size: 13px; }
        .dropdown li .t { font-size: 11px; color: var(--faint); font-family: var(--font-mono); }

        .advanced { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .field { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 240px; }
        .field label { font-size: 12px; color: var(--dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .input { height: 32px; padding: 0 10px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line); color: var(--text); font-family: var(--font-mono); font-size: 13px; outline: 0; width: 100%; transition: border-color .15s, box-shadow .15s; }
        .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
        .input::placeholder { color: var(--faint); font-family: var(--font-sans); }
        .input.sans { font-family: var(--font-sans); }
        .select { height: 30px; padding: 0 28px 0 10px; border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-size: 12.5px; outline: 0; appearance: none; -webkit-appearance: none;
                  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
                  background-position: calc(100% - 14px) 13px, calc(100% - 9px) 13px; background-size: 5px 5px; background-repeat: no-repeat; }
        .select:focus { border-color: var(--accent); }

        /* progress */
        .progress { margin-top: 14px; }
        .progress-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
        .progress-row .right { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
        .progress-detail { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .progress-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
        .progress-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s var(--ease); }

        /* alerts + banners */
        .alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); font-size: 13px; }
        .alert .ic { font-size: 16px; margin-top: 2px; }
        .alert-bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
        .alert-bad .ic, .alert-bad strong { color: var(--bad); }
        .alert-warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 9%, var(--panel)); }
        .alert-warn .ic, .alert-warn strong { color: var(--warn); }
        .alert-info { border-color: color-mix(in srgb, var(--info) 40%, transparent); background: color-mix(in srgb, var(--info) 9%, var(--panel)); }
        .alert-info .ic { color: var(--info); }
        .alert p { margin: 0; } .alert .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

        .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 9px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); font-size: 13px; }
        .banner .lbl { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--dim); }
        .banner.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
        .banner.warn .lbl { color: var(--warn); }
        .banner.bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 8%, var(--panel)); }
        .banner.bad .lbl { color: var(--bad); }
        .banner .sep { color: var(--faint); }

        /* empty states / install */
        .state { max-width: 560px; margin: 56px auto 0; text-align: center; }
        .state .ic-xl { color: var(--faint); }
        .state .ic-xl.accent { color: var(--accent); }
        .state h2 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; margin-top: 14px; }
        .state p { color: var(--dim); margin-top: 8px; }
        .state .quiet { color: var(--faint); font-size: 13px; }
        .state-idle { animation: breathe 3s ease-in-out infinite; }
        .install { margin: 22px auto 0; display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px 6px 6px 16px; background: var(--bg-sunk); border: 1px solid var(--line); border-radius: var(--r-md); }
        .install code { flex: 1; overflow-x: auto; white-space: nowrap; font-size: 13.5px; color: var(--accent); padding: 8px 0; }
        .install code .p { color: var(--faint); user-select: none; margin-right: 8px; }

        /* ---- report header ---- */
        .report-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
        .report-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .report-title h1 { font-family: var(--font-mono); font-size: clamp(18px, 2.4vw, 24px); font-weight: 600; letter-spacing: -.01em; word-break: break-all; }
        .report-title .of { color: var(--faint); font-size: 13px; }
        .report-title .of code { color: var(--dim); }
        .report-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
        .report-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: var(--r-sm); font-size: 12px; font-weight: 500; font-family: var(--font-mono); border: 1px solid var(--line); color: var(--dim); background: var(--panel); white-space: nowrap; }
        .chip .ic { font-size: 13px; }
        .chip-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
        .chip-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
        .chip-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
        .chip-info { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, transparent); background: color-mix(in srgb, var(--info) 10%, transparent); }
        .chip-accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
        .chip-purple { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 40%, transparent); background: color-mix(in srgb, var(--purple) 10%, transparent); }

        .tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: var(--r-sm); font-size: 11px; font-weight: 600; letter-spacing: .02em; background: var(--panel-2); color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
        .tag.mono { font-family: var(--font-mono); font-weight: 500; }
        .tag-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: transparent; }
        .tag-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: transparent; }
        .tag-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: transparent; }
        .tag-info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); border-color: transparent; }
        .tag-accent { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: transparent; }
        .tag-purple { color: var(--purple); background: color-mix(in srgb, var(--purple) 12%, transparent); border-color: transparent; }

        /* redirect chain */

        .hop:hover .tip { opacity: 1; visibility: visible; }
        .hop .tip code { font-size: 11.5px; display: block; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
        .hop .tip .sub { font-size: 11px; color: var(--dim); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
        .chain .arrow { color: var(--faint); font-size: 14px; }

        /* generic tooltip wrapper */

        .has-tip:hover .tip { opacity: 1; visibility: visible; }
        .tip-row { display: flex; justify-content: space-between; gap: 16px; font-size: 12.5px; padding: 2px 0; }
        .tip-row .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
        .tip-row.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; font-weight: 600; }

        /* ---- cards ---- */

        @media (max-width: 900px) { .grid-main { grid-template-columns: 1fr; } }
        .col { display: grid; gap: 16px; align-content: start; }

        .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; min-width: 0; }

        .card-title { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
        .card-title .ic { font-size: 14px; color: var(--faint); }
        .card-sub { font-size: 12px; color: var(--faint); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 4px; }
        .card-body { padding: 16px; }
        .card-body.tight { padding: 10px 16px; }

        .card-foot { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12.5px; }

        .card-foot.bad { background: color-mix(in srgb, var(--bad) 8%, transparent); color: var(--bad); }

        .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px 20px; }
        .fact .l { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 4px; }
        .fact .v { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fact .v.mono { font-size: 13px; }
        .fact .v.big { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-family: var(--font-mono); }

        .rows { display: flex; flex-direction: column; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 12.5px; }

        .row .v .n { color: var(--faint); font-family: var(--font-sans); }
        .mark-ok { color: var(--ok); } .mark-off { color: var(--line-2); }
        .peek { color: var(--faint); display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--r-sm); }

        .kv + .kv { border-top: 1px solid var(--line); }
        .kv:hover { background: var(--hover); }
        .kv .k { color: var(--dim); font-size: 12.5px; }
        .kv .v { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }

        .list { display: flex; flex-direction: column; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
        .list-item + .list-item { border-top: 1px solid var(--line); }
        .list-item:hover { background: var(--hover); }

        .list-item .main { flex: 1; min-width: 0; }
        .list-item .main .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 500; }
        .list-item .main .t code { font-size: 12px; }
        .list-item .main .d { font-size: 12px; color: var(--dim); margin-top: 2px; }
        .list-item .end { flex: none; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .section-l { font-size: 11px; color: var(--faint); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
        .stack-sm > * + * { margin-top: 12px; }

        /* network coordinates */
        .ip-block { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; }
        .ip-block + .ip-block { margin-top: 12px; }
        .ip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
        .ip-head .ip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
        .ip-head .ip i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
        .ip-rows { display: grid; grid-template-columns: 90px 1fr; gap: 3px 10px; font-size: 12px; }
        .ip-rows .k { color: var(--dim); } .ip-rows .v { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ip-ptr { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

        /* ---- modals ---- */

        .modal-foot { padding: 10px 18px; border-top: 1px solid var(--line); font-size: 13px; text-align: center; }

        .tabs { display: flex; gap: 2px; padding: 10px 18px 0; }

        .tab:hover { color: var(--text); }

        .raw { background: var(--bg-sunk); border: 1px solid var(--line); border-radius: var(--r-md); margin: 0 18px 18px; max-height: 64vh; overflow: auto; }

        .search { position: relative; }

        .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

        .cmd-l { font-size: 12.5px; color: var(--dim); }

        .preview-card { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--panel-2); }

        .preview-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .preview-txt { padding: 12px 14px; }

        .favicons { display: flex; align-items: flex-end; justify-content: center; gap: 28px; padding: 8px 0 4px; }
        .favicons > div { text-align: center; }
        .favicons img { display: block; margin: 0 auto 6px; }
        .favicons span { font-size: 11px; color: var(--faint); font-family: var(--font-mono); }

        .plugin-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
        .plugin-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line); }
        .plugin-list li .ic { color: var(--faint); font-size: 16px; }
        .plugin-list .n { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .plugin-list .s { font-size: 11.5px; color: var(--faint); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ---- context menu ---- */
        .ctx { position: fixed; z-index: 90; min-width: 200px; max-width: 320px; padding: 4px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-md); box-shadow: var(--shadow-sm); animation: pop .1s ease-out both; }
        .ctx button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r-sm); font-size: 13px; text-align: left; }
        .ctx button:hover { background: var(--hover); }
        .ctx button .ic { color: var(--dim); font-size: 15px; }
        .ctx button code { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ctx .sep { height: 1px; background: var(--line); margin: 4px 6px; }
        .ctx .ctx-l { padding: 6px 10px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
        .ctx button.on { color: var(--accent); }
        .ctx button.on .ic { color: var(--accent); }
        .ctx button .tick { margin-left: auto; font-size: 14px; }

        /* ---- toast ---- */
        .toast { position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; align-items: center; gap: 16px; padding: 10px 14px 10px 16px; background: var(--text); color: var(--bg); border-radius: var(--r-md); box-shadow: var(--shadow-sm); font-size: 13.5px; font-weight: 500; animation: slide-in .18s var(--ease) both; }
        .toast button { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; opacity: .7; }
        .toast button:hover { opacity: 1; }

        /* ---- footer ---- */
        .foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--faint); }

        /* ---- theme button ---- */
        .theme-btn .ic { transition: transform .3s var(--ease), opacity .2s; }

        @media (max-width: 640px) {
            .wrap { padding: 16px 14px 56px; }
            .topbar-inner { padding: 0 14px; }
            .brand-name { display: none; }
            .hero.is-idle .scanbar { height: 54px; }
            .scan-input { font-size: 15px; }
            .facts { grid-template-columns: 1fr 1fr; }
            .kv { grid-template-columns: 1fr; gap: 2px; }
            .modal-root { padding: 12px; }
            .modal { max-height: 92vh; }
            .toast { left: 14px; right: 14px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; } }
    </style>
</head>

            $('#topActions').innerHTML = `
                <a class="icon-btn" href="https://github.com/austinginder/periscope" target="_blank" rel="noopener" title="GitHub">${ic('github', 'fill')}</a>
                ${when(!S.reportMode && (!S.localMode || S.bridgeConnected === true), `<button class="icon-btn" data-act="history" title="Scan log (⌘K)">${ic('history')}</button>`)}
                <button class="icon-btn" data-act="help" title="Help (?)">${ic('help')}</button>
                <button class="icon-btn theme-btn" data-act="theme" data-theme-menu title="${S.themePref === 'system' ? 'Following system (' + S.theme + '). Click to switch, right-click for options' : (S.theme === 'dark' ? 'Switch to light' : 'Switch to dark') + '. Right-click for options'}">${ic(S.themePref === 'system' ? 'monitor' : S.theme === 'dark' ? 'moon' : 'sun')}</button>`;
        }

        function renderHero() {
            const hero = $('#hero');
            const show = !S.reportMode && (!S.localMode || S.bridgeConnected === true);
            hero.hidden = !show;
            const idle = !S.response.domain && !S.response.timestamp;
            hero.classList.toggle('is-idle', idle);
            $('#heroCopy').hidden = !(idle && !S.loading);
            const btn = $('#scanBtn');
            btn.disabled = S.loading;
            btn.innerHTML = `${ic(S.loading ? 'refresh' : 'arrow-right', S.loading ? 'spin' : '')}<span>${S.loading ? esc(S.loadingText) : 'Scan'}</span>`;
            const input = $('#scanInput');
            if (input.value !== S.domain && document.activeElement !== input) input.value = S.domain;
            $('#advToggle').innerHTML = `${ic(S.showAdvanced ? 'chevron-down' : 'chevron-right')} Advanced`;
            $('#advanced').hidden = !S.showAdvanced;
            const dns = $('#dnsInput');
            if (dns.value !== S.dnsServer && document.activeElement !== dns) dns.value = S.dnsServer;
            $('#dnsClear').hidden = !S.dnsServer;
            renderDropdown();
            renderProgress();
            renderErrors();
        }

        function renderDropdown() {
            const items = S.acOpen ? D.filteredHistory() : [];
            $('#dropdown').innerHTML = items.length ? `<div class="dropdown scroll pop">
                <div class="dropdown-label">From the scan log</div>
                <ul>${items.map(i => `<li data-act="pick" data-domain="${esc(i.domain)}" data-id="${esc(i.id || '')}" data-ts="${esc(i.timestamp)}"><span class="d">${esc(i.domain)}</span><span class="t">${esc(fmtDay(i.timestamp))}</span></li>`).join('')}</ul>
            </div>` : '';
        }

        function renderProgress() {
            const p = S.progress;
            if (S.loading && !S.loadingFromHistory) {
                // Build the block once; later events only patch text and width so the entrance
                // animation does not replay on every progress message.
                let el = $('#progress .progress');
                if (!el) {
                    $('#progress').innerHTML = `<div class="progress rise">
                        <div class="progress-row"><span class="p-msg"></span>
                            <span class="right"><span class="p-step num"></span><button class="icon-btn sm danger" data-act="stop" title="Stop scan">${ic('stop')}</button></span></div>
                        <div class="progress-detail p-detail"></div>
                        <div class="progress-bar"><i style="width:0%"></i></div></div>`;
                    el = $('#progress .progress');
                }
                $('.p-msg', el).textContent = p.message || '';
                $('.p-step', el).textContent = `${p.step}/${p.total}`;
                const d = $('.p-detail', el); d.textContent = p.detail || ''; d.hidden = !p.detail;
                $('.progress-bar i', el).style.width = `${Math.max(0, Math.min(100, p.percent || 0))}%`;
            } else if (S.loading && S.loadingFromHistory) {
                $('#progress').innerHTML = `<div class="progress rise dim small" style="display:flex;align-items:center;justify-content:center;gap:8px">${ic('refresh', 'spin')} Refreshing scan data…</div>`;
            } else $('#progress').innerHTML = '';
        }

        function renderErrors() {
            const errs = S.response.errors || [];
            $('#errors').innerHTML = errs.length ? `<div class="stack rise" style="margin-top:14px">${errs.map(e => `<div class="alert alert-bad">${ic('alert-circle')}<p>${e}</p></div>`).join('')}</div>` : '';
        }

        const installBlock = () => `<div class="install"><code class="scroll"><span class="p">$</span>${esc(INSTALL_CMD)}</code><button class="icon-btn" data-act="copyInstall" title="Copy command">${ic('copy')}</button></div>`;

        function renderStates() {
            const el = $('#states');
            const noResult = !S.response.domain && !S.response.timestamp;
            if (S.reportMode || !noResult || S.loading) { el.innerHTML = ''; return; }
            if (!S.localMode) {
                el.innerHTML = `<section class="state rise">${ic('plug', 'ic-xl')}
                    <h2>Run searches locally</h2>
                    <p>Periscope connects to a small bridge on your own machine to run <code>dig</code>, <code>whois</code> and <code>curl</code>. Nothing leaves your computer.</p>
                    ${installBlock()}
                    <p style="margin-top:20px"><a href="?local=true" class="link">I've started the script, connect now ${ic('arrow-right')}</a></p></section>`;
            } else if (S.bridgeConnected === false) {
                el.innerHTML = `<section class="state rise">
                    <div class="alert alert-bad" style="text-align:left">${ic('plug-off')}<div><p><strong>Local bridge unreachable</strong></p><p class="sub">Nothing is answering at <code>127.0.0.1:8989</code>. Start the bridge, then retry.</p></div></div>
                    <h2 style="margin-top:28px">Run searches locally</h2>
                    <p>Periscope connects to a small bridge on your own machine to run <code>dig</code>, <code>whois</code> and <code>curl</code>.</p>
                    ${installBlock()}
                    <p style="margin-top:20px"><button class="link" data-act="retryBridge">${ic('refresh')} Retry connection</button></p></section>`;
            } else if (S.bridgeConnected === true) {
                el.innerHTML = `<section class="state state-idle">${ic('plug', 'ic-xl accent')}<p style="color:var(--text);font-weight:500;margin-top:10px">Local bridge active</p><p class="quiet">Waiting for target coordinates.</p></section>`;
            } else {
                el.innerHTML = `<section class="state state-idle">${ic('dots', 'ic-xl fill')}<p style="color:var(--text);font-weight:500;margin-top:10px">Connecting to local bridge…</p></section>`;
            }
        }

        // ---- results ----
        const card = (title, icon, body, right, copyKey) => `<div class="card"><div class="card-head"><span class="card-title">${ic(icon)} ${title}</span><span class="card-right">${right || ''}${copyKey ? `<button class="icon-btn sm copy-card" data-act="copyCard" data-card="${copyKey}" title="Copy as text">${ic('copy')}</button>` : ''}</span></div>${body}</div>`;
        const fact = (label, value, cls, title) => `<div class="fact"><div class="l">${label}</div><div class="v ${cls || ''}"${title ? ` title="${esc(title)}"` : ''}>${value}</div></div>`;

        function renderResults() {
            const el = $('#results');
            const r = S.response;
            if (!r.timestamp) { el.innerHTML = ''; return; }
            if (r.domain_exists === false) { el.innerHTML = renderNotRegistered(r); return; }
            const chain = D.displayChain();
            const cross = D.isCrossDomain(chain);
            const other = D.otherVersions();
            const html = `<section class="rise stack" style="margin-top:28px">
                <div class="report-head">
                    <div style="min-width:0">
                        <div class="report-title">
                            <h1${ctxAttr(r.target_host || S.domain)}>${esc(r.target_host || S.domain)}</h1>
                            ${when(r.is_subdomain, () => `<span class="of">subdomain of <code${ctxAttr(r.root_domain)}>${esc(r.root_domain)}</code></span>`)}
                            ${when(!S.reportMode, () => `<button class="icon-btn sm" data-act="copyLink" title="Copy link to this report">${ic('link')}</button>`)}
                        </div>
                        ${when(r.metadata?.meta_tags?.basic?.title || r.metadata?.meta_tags?.basic?.description, () => { const b = r.metadata.meta_tags.basic; return `<div class="report-page">${when(b.title, () => `<div class="pt"${ctxAttr(decodeEntities(b.title))}>${esc(decodeEntities(b.title))}</div>`)}${when(b.description, () => `<div class="pd" title="${esc(decodeEntities(b.description))}">${esc(decodeEntities(b.description))}</div>`)}</div>`; })}
                        <div class="report-meta">
                            <span class="chip chip-plain">${ic('clock')} ${esc(fmtDate(r.timestamp))}</span>
                            ${when(r.request, () => {
                                const q = r.request, t = q.timing;
                                return `${when(q.status_code, () => `<span class="chip ${statusClass(q.status_code)}">${q.status_code} ${esc(q.status_text || '')}</span>`)}
                                ${when(q.protocol, () => `<span class="chip">${esc(q.protocol)}</span>`)}
                                ${when(q.remote_address, () => `<span class="chip"${ctxAttr(q.remote_address)}>${ic('server')} ${esc(q.remote_address)}</span>`)}
                                ${when(t && t.total !== undefined, () => `<span class="chip has-tip ${timingClass(t.total)}" style="cursor:help">${ic('zap')} ${t.total}ms
                                    <div class="tip"><div class="eyebrow" style="margin-bottom:6px">Timing</div>
                                    <div class="tip-row"><span class="dim">DNS lookup</span><span class="v">${t.dns_lookup || 0}ms</span></div>
                                    <div class="tip-row"><span class="dim">Connect</span><span class="v">${t.connect || 0}ms</span></div>
                                    <div class="tip-row total"><span>Total</span><span class="v">${t.total}ms</span></div></div></span>`)}`;
                            })}
                            ${when(r.dns_server, () => `<span class="chip chip-warn" title="DNS records were queried via a custom resolver">${ic('server')} via ${esc(r.dns_server)}</span>`)}
                        </div>
                    </div>
                    ${when(!S.reportMode, () => `<div class="report-actions">
                        ${when(other.length, () => `<button class="btn btn-ghost btn-sm" data-act="versions">${ic('history')} ${plural(other.length, 'other scan')}</button>`)}
                        ${when(S.localMode && r.raw_available, `<button class="btn btn-ghost btn-sm" data-act="export" title="Export as a standalone HTML report">${ic('export')} Export</button>`)}
                        ${when(S.localMode && r.raw_available && D.currentHistoryId(), `<button class="icon-btn" data-act="refresh" ${S.refreshing ? 'disabled' : ''} title="Reprocess from stored raw data">${ic('refresh', S.refreshing ? 'spin' : '')}</button>`)}
                    </div>`)}
                </div>

                ${when(chain && chain.length > 1, () => `<div class="banner${cross ? ' warn' : ''}"><span class="lbl">${ic('corner-right')} Redirects</span><span class="chain">
                    ${chain.map((hop, i) => `<span class="hop"><code${ctxAttr(D.hopLabel(chain, hop, i))}>${esc(D.hopLabel(chain, hop, i))}</code>
                        ${hop.type === 'meta_refresh' ? '<span class="tag tag-purple">META</span>' : hop.type === 'javascript' ? '<span class="tag tag-warn">JS</span>' : `<span class="tag mono ${hopClass(hop.status_code)}">${esc(hop.status_code)}</span>`}
                        <span class="tip"><code>${esc(hop.url)}</code>${when(hop.remote_address, () => `<span class="sub">${ic('server')} ${esc(hop.remote_address)}</span>`)}</span></span>
                        ${i < chain.length - 1 ? ic('arrow-right', 'arrow') : ''}`).join('')}</span></div>`)}

                ${when(r.indexability && r.indexability.blocked, () => `<div class="banner bad"><span class="lbl">${ic('eye-off')} Hidden from search engines</span><span class="dim small">${esc((r.indexability.reasons || []).map(x => x.detail).join(' · '))}</span></div>`)}

                <div class="grid grid-cards">${renderOverviewCards(r)}</div>

                <div class="grid grid-main">
                    <div class="col">${renderRegistration(r)}${renderNetwork(r)}${renderHeaders(r)}</div>
                    <div class="col">${renderSpf()}${renderEmailHealth()}${renderDns()}${renderZone(r)}</div>
                </div>

                ${when(S.reportMode, () => `<footer class="foot"><span>Generated by <a href="https://periscope.run" target="_blank" rel="noopener">Periscope</a> v${esc(r.plugin_version || VERSION)}</span><span>Scanned ${esc(fmtDate(r.timestamp))}</span></footer>`)}
            </section>`;
            el.innerHTML = html;
        }

        function renderNotRegistered(r) {
            const other = D.otherVersions();
            return `<section class="rise" style="margin-top:32px">
                <div class="report-head"><div>
                    <div class="report-title"><h1>${esc(r.root_domain)}</h1><span class="chip chip-bad sans">${ic('globe-off')} Not registered</span></div>
                    <div class="report-meta"><span class="chip chip-plain">${ic('clock')} ${esc(fmtDate(r.timestamp))}</span></div></div>
                    <div class="report-actions">${when(other.length && !S.reportMode, () => `<button class="btn btn-ghost btn-sm" data-act="versions">${ic('history')} ${plural(other.length, 'other scan')}</button>`)}</div>
                </div>
                <div class="state">${ic('globe-off', 'ic-2x')}<h2>Domain not registered</h2><p><code>${esc(r.root_domain)}</code> does not exist at any registrar right now.</p></div>
            </section>`;
        }

        function renderOverviewCards(r) {
            let out = '';
            if (r.ssl && r.ssl.valid) {
                const d = r.ssl.days_remaining, tone = d < 14 ? 'bad' : d < 30 ? 'warn' : 'ok';
                out += card('TLS certificate', 'lock', `<div class="card-body"><div class="facts">
                    ${fact('Days left', esc(d), 'big ' + tone)}
                    ${fact('Expires', esc(r.ssl.expires), 'mono' + (d < 30 ? ' warn' : ''))}
                    ${when(r.ssl.issued, () => fact('Issued', esc(r.ssl.issued), 'mono'))}
                    ${when(r.ssl.issuer, () => `<div class="fact" style="grid-column:1/-1"><div class="l">Issuer</div><div class="v mono" title="${esc(r.ssl.issuer)}"${ctxAttr(r.ssl.issuer)}>${esc(r.ssl.issuer)}</div></div>`)}
                    </div></div>`, `<span class="tag tag-${tone}">${d < 14 ? 'Expiring' : d < 30 ? 'Renew soon' : 'Valid'}</span>`, 'tls');
            }
            const cms = r.cms && !Array.isArray(r.cms) ? r.cms : null;
            if (cms || (r.raw_available && r.domain_exists !== false)) {
                const badges = `<span class="chips">
                    ${when(cms && cms.multisite, '<a class="tag tag-purple" href="https://developer.wordpress.org/advanced-administration/multisite/" target="_blank" rel="noopener" title="WordPress Multisite detected">Multisite</a>')}
                    ${when(cms && cms.multitenancy, '<a class="tag tag-warn" href="https://wpfreighter.com" target="_blank" rel="noopener" title="WP Freighter multi-tenant detected">Multi-tenant</a>')}</span>`;
                out += card('Platform', 'layers', `<div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
                    <span style="display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:600;letter-spacing:-.01em">${esc(cms ? cms.name : 'HTML')}
                        ${when(cms && cms.name === 'WordPress' && cms.plugins && cms.plugins.length, () => `<button class="btn btn-ghost btn-xs" data-act="plugins" title="${cms.plugins.length} plugins detected">${ic('puzzle')} ${cms.plugins.length}</button>`)}</span>
                    <span class="chips">${when(cms && cms.version, () => `<span class="chip"${ctxAttr(cms.version)}>v${esc(cms.version)}</span>`)}${when(r.infrastructure && r.infrastructure.language, () => `<span class="chip chip-accent">${esc(r.infrastructure.language)}</span>`)}</span>
                    </div>`, badges, 'platform');
            }
            const inf = r.infrastructure && !Array.isArray(r.infrastructure) ? r.infrastructure : null;
            if (inf && (inf.host || inf.cdn || inf.server)) {
                out += card('Infrastructure', 'server', `<div class="card-body"><div class="facts">
                    ${when(inf.host, () => `<div class="fact"><div class="l">Host</div><div class="v"${ctxAttr(inf.host)}>${esc(inf.host)}</div></div>`)}${when(inf.cdn, () => `<div class="fact"><div class="l">CDN</div><div class="v"${ctxAttr(inf.cdn)}>${esc(inf.cdn)}</div></div>`)}${when(inf.server, () => `<div class="fact"><div class="l">Server</div><div class="v mono" title="${esc(inf.server)}"${ctxAttr(inf.server)}>${esc(inf.server)}</div></div>`)}
                    </div></div>`, '', 'infra');
            }
            if (r.security && r.security.score) {
                out += card('Security headers', 'shield-check', `<div class="card-body tight rows">${D.securityHeaders().map(h => {
                    const on = r.security[h.key] && r.security[h.key].present;
                    return `<div class="row"><span class="k"><span class="mono">${h.label}</span>${h.legacy ? '<span class="tag" title="Deprecated header; modern browsers ignore it">legacy</span>' : ''}</span>${ic(on ? 'check-circle' : 'x-circle', on ? (h.legacy ? 'dim' : 'mark-ok') : 'mark-off')}</div>`;
                }).join('')}</div>`, `<span class="tag mono score-tag ${scoreTag(r.security.score.value, 2, 4)}">${r.security.score.value}/${r.security.score.total}</span>`, 'security');
            }
            const ck = r.cookie_security;
            if (ck && ck.cookies && ck.cookies.length) {
                const flag = (tone, label, title) => `<span class="${tone}" style="display:inline-flex;align-items:center;gap:3px"${title ? ` title="${esc(title)}"` : ''}>${ic(tone === 'ok' ? 'check-circle' : tone === 'warn' ? 'alert' : 'x-circle')} ${label}</span>`;
                const ssTitle = t => t === 'ok' ? 'Cookie is not sent on cross-site requests' : t === 'warn' ? 'SameSite=None: sent on every cross-site request. Weakest setting; requires Secure' : 'No SameSite attribute: browsers default to Lax, but the intent is not declared';
                out += card('Cookies', 'cookie', `<div class="card-body tight rows">${ck.cookies.map(c => { const ss = D.sameSiteTone(c); return `<div class="row" style="align-items:flex-start;flex-wrap:wrap">
                    <span class="k"><code class="truncate" style="max-width:220px" title="${esc(c.name)}"${ctxAttr(c.name)}>${esc(c.name)}</code>${when(c.session, '<span class="tag tag-warn">session</span>')}</span>
                    <span class="v" style="font-family:var(--font-sans);gap:10px">${flag(c.secure ? 'ok' : 'bad', 'Secure')}${flag(c.httponly ? 'ok' : 'bad', 'HttpOnly')}${flag(ss, 'SameSite' + (c.samesite ? '=' + esc(c.samesite) : ''), ssTitle(ss))}</span></div>`; }).join('')}</div>`,
                    ck.score ? `<span class="tag mono score-tag ${ck.score.value === 0 ? 'tag-bad' : ck.score.value <= 2 ? 'tag-warn' : 'tag-ok'}">${ck.score.value}/${ck.score.total}</span>` : '', 'cookies');
            }
            const t = r.technology && !Array.isArray(r.technology) ? r.technology : null;
            if (t && (t.frameworks?.length || t.analytics?.length || t.ecommerce?.length || t.widgets?.length)) {
                const group = (label, items, cls, fmt, ctxOf) => items && items.length ? `<div><div class="section-l">${label}</div><div class="chips">${items.map(x => `<span class="tag ${cls}"${ctxOf ? ctxAttr(ctxOf(x)) : ''}${ctxOf && ctxOf(x) ? ' title="Click to copy the ID"' : ''}>${fmt ? fmt(x) : esc(x)}</span>`).join('')}</div></div>` : '';
                out += card('Technology', 'code', `<div class="card-body stack-sm">
                    ${group('Frameworks', t.frameworks, 'tag-accent')}
                    ${group('Analytics', t.analytics, 'tag-purple', a => esc(a.name) + (a.id ? `<code style="opacity:.75;font-weight:400;margin-left:4px">${esc(a.id)}</code>` : ''), a => a.id || '')}
                    ${group('E-commerce', t.ecommerce, 'tag-ok')}
                    ${group('Widgets', t.widgets, 'tag-warn')}</div>`, '', 'tech');
            }
            if (r.metadata && !Array.isArray(r.metadata) && Object.keys(r.metadata).length) {
                const items = D.metaItems(), found = items.filter(m => m.present), missing = items.filter(m => !m.present);
                const previewBtn = m => m.preview ? `<button class="peek" data-act="${m.preview.act}"${m.preview.type ? ` data-type="${esc(m.preview.type)}" data-title="${esc(m.preview.title)}"` : ''} title="Preview">${ic(m.icon || 'eye')}</button>` : '';
                out += card('Well-known files', 'file', `<div class="card-body tight rows">
                    ${found.map(m => {
                        const hasDetail = m.detail && m.detail.length, open = hasDetail && S.openRows[m.key];
                        const toggle = hasDetail ? `<button class="peek" data-act="toggleRow" data-row="${m.key}" title="${open ? 'Hide' : 'Show'} details">${ic(open ? 'chevron-up' : 'chevron-down')}</button>` : '';
                        const detail = open ? `<div class="sub-list">${m.detail.slice(0, 20).map(d => `<code${ctxAttr(d.v)}>${d.k ? `<span class="dim">${esc(d.k)}</span> ` : ''}${esc(d.v)}</code>`).join('')}${m.detailTotal > Math.min(20, m.detail.length) ? `<span class="more">and ${m.detailTotal - Math.min(20, m.detail.length)} more in the raw file</span>` : ''}</div>` : '';
                        return `<div class="row${hasDetail ? ' stack-row' : ''}"><div class="row-main"><span class="k"><span class="mono">${m.label}</span>${previewBtn(m)}${toggle}</span><span class="v">${when(m.note, () => `<span class="n">${esc(m.note)}</span>`)}${ic('check-circle', 'mark-ok')}</span></div>${detail}</div>`;
                    }).join('')}
                    ${when(missing.length, () => `<button class="link link-dim small" style="padding:10px 0 4px;border-top:1px solid var(--line);margin-top:4px" data-act="toggleMissing">${ic(S.showMissingMeta ? 'chevron-up' : 'chevron-down')} ${S.showMissingMeta ? 'Hide' : 'Show'} ${missing.length} not found</button>`)}
                    ${when(S.showMissingMeta, () => missing.map(m => `<div class="row"><span class="k mono">${m.label}</span>${ic('x-circle', 'mark-off')}</div>`).join(''))}
                    </div>`, `<span class="tag mono">${found.length}/${items.length}</span>`, 'wellknown');
            }
            return out;
        }

        function renderRegistration(r) {
            const hasRaw = r.raw_available || (S.reportMode && S.embed?.rawFiles?.whois_domain);
            const rows = (r.domain || []).map(rec => `<div class="kv"><span class="k">${esc(rec.name)}</span><span class="v"${ctxAttr(rec.value)}>${esc(rec.value)}</span></div>`).join('');
            return card(`Registration${r.is_subdomain ? `<span class="card-sub">${esc(r.root_domain)}</span>` : ''}`, 'idcard',
                `<div class="card-body flush">${rows || '<div class="hlist-empty small">No registration data.</div>'}</div>`,
                hasRaw ? `<button class="link link-dim small" data-act="rawWhois">Raw ${ic('chevron-right')}</button>` : '', 'registration');
        }

        function renderNetwork(r) {
            const ips = Object.entries(r.ip_lookup || {});
            const blocks = ips.map(([ip, rows]) => {
                const lines = String(rows).split('\n').map(line => { const i = line.indexOf(':'); return i < 0 ? null : [line.slice(0, i).trim(), line.slice(i + 1).trim()]; }).filter(x => x && x[1] && x[1] !== 'N/A');
                const ptr = r.ptr_records && r.ptr_records[ip];
                return `<div class="ip-block"><div class="ip-head"><span class="ip"${ctxAttr(ip)}><i></i>${esc(ip)}</span>${when(!S.reportMode, () => `<button class="btn btn-ghost btn-xs" data-act="whois" data-ip="${esc(ip)}">WHOIS</button>`)}</div>
                    <div class="ip-rows">${lines.map(([k, v]) => `<span class="k">${esc(k)}</span><span class="v" title="${esc(v)}"${ctxAttr(v)}>${esc(v)}</span>`).join('')}</div>
                    ${when(ptr, () => `<div class="ip-ptr"><div class="ip-rows"><span class="k">PTR</span><span class="v" style="display:flex;align-items:center;gap:8px"><span class="truncate" title="${esc(ptr.ptr)}"${ctxAttr(ptr.ptr)}>${esc(ptr.ptr)}</span>
                        ${ptr.forward_match ? `<span class="tag tag-ok" title="Forward lookup resolves back to this IP">${ic('check-circle')} verified</span>` : `<span class="tag tag-warn" title="Forward lookup does not resolve back to this IP">${ic('alert')} mismatch</span>`}</span></div></div>`)}
                </div>`;
            }).join('');
            return card('Network coordinates', 'network', `<div class="card-body">${blocks || '<div class="hlist-empty small" style="padding:8px">No A records resolved.</div>'}</div>`, '', 'network');
        }

        function renderHeaders(r) {
            const h = r.http_headers;
            if (!h || !Object.keys(h).length) return '';
            const rows = Object.entries(h).map(([k, v]) => { const val = Array.isArray(v) ? v.join('\n') : String(v); return `<tr><td class="k mono">${esc(k)}</td><td class="mono" style="white-space:pre-wrap"${ctxAttr(val)}>${esc(val)}</td></tr>`; }).join('');
            return card('Response headers', 'server', `<div class="card-body flush table-wrap"><table class="table"><tbody>${rows}</tbody></table></div>`, `<span class="tag mono">${Object.keys(h).length}</span>`, 'headers');
        }

        function renderSpf() {
            const spf = D.spf();
            if (!spf) return '';
            const iconFor = m => m.type === 'version' ? ic('tag') : m.type === 'include' ? ic('merge', 'accent') : (m.type === 'ip4' || m.type === 'ip6') ? ic('hash', 'ok') : m.type === 'a' ? ic('letter-a', 'info') : m.type === 'mx' ? ic('mail', 'purple') : m.type === 'all' ? ic('shield', 'dim') : m.type === 'redirect' ? ic('corner-right', 'warn') : ic('cog');
            const status = spf.isValid && !spf.hasWarnings ? `<span class="tag tag-ok">${ic('check-circle')} Valid</span>` : spf.isValid ? `<span class="tag tag-warn">${ic('alert')} Valid with warnings</span>` : `<span class="tag tag-bad">${ic('x-circle')} Invalid</span>`;
            const lookups = `<span class="tag mono ${spf.dnsLookups > 10 ? 'tag-bad' : spf.dnsLookups > 8 ? 'tag-warn' : ''}">${spf.dnsLookups}/10 lookups</span>`;
            const notes = (list, tone, icon) => list.length ? `<div class="card-foot ${tone}" style="border-top:0;border-bottom:1px solid var(--line)">${list.map(x => `<div style="display:flex;gap:8px;align-items:flex-start">${ic(icon, '')}<span>${esc(x)}</span></div>`).join('')}</div>` : '';
            const items = spf.mechanisms.map(m => `<div class="list-item"><span class="lead">${iconFor(m)}</span>
                <span class="main"><span class="t"><code${ctxAttr(m.value || m.raw)}>${esc(m.raw)}</code>${when(m.provider, () => `<span class="tag tag-accent">${esc(m.provider)}</span>`)}${when(m.isDnsLookup, ic('server', 'faint'))}</span><span class="d">${esc(m.description)}</span></span>
                ${when(m.qualifier && m.type !== 'version', () => `<span class="end"><span class="tag mono ${m.qualifier === '+' ? 'tag-ok' : m.qualifier === '-' ? 'tag-bad' : m.qualifier === '~' ? 'tag-warn' : ''}">${esc(m.qualifierDesc)}</span></span>`)}</div>`).join('');
            return card('SPF', 'mail', `${notes(spf.errors, 'bad', 'x-circle')}${notes(spf.warnings, 'warn', 'alert')}<div class="list">${items}</div>`, `<span class="chips" style="align-items:center">${status}${lookups}</span>`, 'spf');
        }

        function renderEmailHealth() {
            const e = D.emailHealth();
            if (!e) return '';
            const gradeCls = e.grade === 'A' ? 'ok' : e.grade === 'B' ? 'accent' : e.grade === 'F' ? 'bad' : 'warn';
            const score = (v, max) => `<span class="tag mono ${v === max ? 'tag-ok' : v > 0 ? 'tag-warn' : 'tag-bad'}">+${v}/${max}</span>`;
            const item = (lead, title, desc, bad, end) => `<div class="list-item"><span class="lead">${lead}</span><span class="main"><span class="t">${title}</span><span class="d${bad ? ' bad' : ''}">${esc(desc)}</span></span><span class="end">${end}</span></div>`;
            const body = `<div class="list">
                ${item(ic('mail', 'purple'), 'MX records', `${plural(e.mxCount, 'mail server')} configured`, false, '<span class="tag mono tag-ok">+10</span>')}
                ${item(ic(e.spf.present ? 'check-circle' : 'x-circle', e.spf.present ? 'ok' : 'bad'), 'SPF', e.spf.present ? e.spf.details.join(' · ') : 'No SPF record found', !e.spf.present, score(e.spf.score, 25))}
                ${e.dkim.present
                    ? `<div class="list-item"><span class="lead">${ic('key', 'accent')}</span><span class="main"><span class="t">DKIM</span><span class="d">Selectors: ${e.dkim.selectors.map(s => `<code${ctxAttr(s)}>${esc(s)}</code>`).join(', ')}</span></span><span class="end">${score(e.dkim.score, 30)}</span></div>`
                    : item(ic('key-off', 'bad'), 'DKIM', 'No DKIM records found', true, score(e.dkim.score, 30))}
                ${item(ic(e.dmarc.present ? 'shield-check' : 'shield-off', e.dmarc.present ? 'ok' : 'bad'), 'DMARC', e.dmarc.present ? e.dmarc.details.join(' · ') : 'No DMARC record found', !e.dmarc.present, score(e.dmarc.score, 35))}
                </div>
                ${when(e.recommendations.length, () => `<div class="card-foot warn"><div class="eyebrow" style="color:inherit;display:flex;align-items:center;gap:6px;margin-bottom:6px">${ic('bulb')} Recommendations</div>${e.recommendations.map(x => `<div style="display:flex;gap:6px;align-items:flex-start;padding:2px 0">${ic('chevron-right')}<span>${esc(x)}</span></div>`).join('')}</div>`)}`;
            return card('Email health', 'shield-check', body, `<span style="display:inline-flex;align-items:baseline;gap:10px"><span class="grade ${gradeCls}">${e.grade}</span><span class="mono small dim num">${e.totalScore}/${e.maxScore}</span></span>`, 'email');
        }

        function renderDns() {
            const recs = D.sortedDns();
            const rows = recs.map(x => `<tr><td class="type">${esc(x.type)}</td><td class="name"${ctxAttr(x.name)}>${esc(x.name)}</td><td class="mono"${ctxAttr(x.value)}>${esc(x.value)}</td></tr>`).join('');
            return card('DNS records', 'globe', `<div class="card-body flush table-wrap"><table class="table"><thead><tr><th style="width:70px">Type</th><th style="width:150px">Name</th><th>Value</th></tr></thead><tbody>${rows || '<tr><td colspan="3" class="dim">No records.</td></tr>'}</tbody></table></div>`, `<span class="tag mono">${recs.length}</span>`, 'dns');
        }

        function renderZone(r) {
            if (!r.zone) return '';
            return card('BIND zone file', 'terminal', `<div class="zone scroll"><pre>${D.zoneHtml()}</pre></div>`,
                `<span class="zone-actions"><button class="icon-btn sm" data-act="copyZone" title="Copy">${ic('copy')}</button><button class="icon-btn sm" data-act="downloadZone" title="Download">${ic('download')}</button></span>`);
        }

        // ---- context menu + toast ----
        function renderCtx() {
            const c = S.ctx;
            if (!c.show) { $('#ctx').innerHTML = ''; return; }
            const v = c.value, dom = !S.reportMode && isDomain(v), ip = !S.reportMode && isIp(v);
            $('#ctx').innerHTML = `<div class="ctx" style="top:${c.y}px;left:${c.x}px">
                ${when(dom, () => `<button data-act="dig">${ic('globe')} Dig <code>${esc(v)}</code></button>`)}
                ${when(ip, () => `<button data-act="whoisIp">${ic('idcard')} Whois <code>${esc(v)}</code></button>`)}
                ${when(dom, () => `<button data-act="scanTarget">${ic('scope')} Scan <code>${esc(v)}</code></button>`)}
                ${when(dom || ip, '<div class="sep"></div>')}
                <button data-act="copyValue">${ic('copy')} Copy value</button></div>`;
            // keep the menu on screen
            const el = $('#ctx .ctx');
            if (el) {
                const rct = el.getBoundingClientRect();
                if (rct.right > window.innerWidth - 8) el.style.left = Math.max(8, window.innerWidth - rct.width - 8) + 'px';
                if (rct.bottom > window.innerHeight - 8) el.style.top = Math.max(8, window.innerHeight - rct.height - 8) + 'px';
            }
        }
        function renderThemeMenu() {
            const m = S.themeMenu;
            if (!m.show) { $('#themeMenu').innerHTML = ''; return; }
            const item = (v, icon, label) => `<button data-act="setTheme" data-value="${v}" class="${S.themePref === v ? 'on' : ''}">${ic(icon)} ${label}${S.themePref === v ? ic('check', 'tick') : ''}</button>`;
            $('#themeMenu').innerHTML = `<div class="ctx" style="top:${m.y}px;left:${m.x}px"><div class="ctx-l">Appearance</div>${item('system', 'monitor', 'System')}${item('light', 'sun', 'Light')}${item('dark', 'moon', 'Dark')}</div>`;
            const el = $('#themeMenu .ctx');
            if (el) { const r = el.getBoundingClientRect(); if (r.right > window.innerWidth - 8) el.style.left = Math.max(8, window.innerWidth - r.width - 8) + 'px'; }
        }
        function renderToast() {
            $('#toast').innerHTML = S.toast.show ? `<div class="toast"><span>${esc(S.toast.message)}</span><button data-act="dismissToast">DISMISS</button></div>` : '';
        }
        function showToast(message) {
            clearTimeout(S.toast.timer);
            S.toast = { show: true, message, timer: setTimeout(() => { S.toast.show = false; renderToast(); }, 3000) };
            renderToast();
        }

        // ------------------------------------------------------------------
        // Modals (one container, rendered from state)
        // ------------------------------------------------------------------
        const modal = (key, size, title, body, acts) => `<div class="modal-root" data-modal="${key}"><div class="scrim" data-act="close" data-key="${key}"></div>
            <div class="modal ${size || ''}"><div class="modal-head"><h3>${title}</h3><div class="acts">${acts || ''}<button class="icon-btn sm" data-act="close" data-key="${key}" title="Close (Esc)">${ic('x')}</button></div></div>${body}</div></div>`;
        const kvRow = (k, v, extra) => `<div class="row"><span class="k">${k}</span><span class="v"${extra || ''}>${v}</span></div>`;

        function renderModals() {
            const r = S.response, mt = r.metadata?.meta_tags || {};
            let html = '';

            if (S.dialog.show) {
                const d = S.dialog;
                html += modal('dialog', 'lg', esc(d.title), `
                    ${when(d.tabs, () => `<div class="tabs">${Object.keys(d.tabs).map(t => `<button class="tab${d.activeTab === t ? ' on' : ''}" data-act="tab" data-tab="${esc(t)}">${esc(t)}</button>`).join('')}</div>`)}
                    <div class="raw scroll"${d.tabs ? '' : ' style="margin-top:18px"'}><pre>${esc(d.tabs && d.activeTab ? d.tabs[d.activeTab] : d.content)}</pre></div>`);
            }

            if (S.historyOpen) {
                const f = S.historyFilters, n = D.activeFilterCount();
                const opt = (v, label, cur) => `<option value="${esc(v)}"${cur === v ? ' selected' : ''}>${esc(label)}</option>`;
                html += modal('history', 'md', `${ic('history', 'dim')} Scan log ${S.historyTotal ? `<span class="tag mono">${S.historyTotal.toLocaleString()}</span>` : ''}`, `
                    <div style="padding:12px 18px;border-bottom:1px solid var(--line)">
                        <div class="search">${ic('search')}<input id="historySearch" type="text" class="input" placeholder="Search domains…" spellcheck="false" value="${esc(S.historySearch)}"></div>
                        <div class="filters">
                            <select class="select" data-filter="existence">${opt('all', 'All domains', f.existence)}${opt('exists', 'Exists', f.existence)}${opt('nonexistent', 'Non-existent', f.existence)}</select>
                            <select class="select" data-filter="platform">${opt('all', 'Any platform', f.platform)}${S.availablePlatforms.map(p => opt(p, p, f.platform)).join('')}</select>
                            <select class="select" data-filter="scanCount">${opt('all', 'Any # scans', f.scanCount)}${S.scanCountOptions.map(o => opt(o.value, o.label, f.scanCount)).join('')}</select>
                            <select class="select" data-filter="indexability">${opt('all', 'Any indexability', f.indexability)}${opt('indexable', 'Indexable', f.indexability)}${opt('hidden', 'Hidden from search', f.indexability)}</select>
                            ${when(n, () => `<button class="btn btn-ghost btn-sm" data-act="clearFilters">${ic('x')} Clear</button>`)}
                        </div>
                    </div>
                    <div class="modal-body flush scroll" style="max-height:50vh" id="historyList">
                        ${S.historyItems.length ? `<ul class="hlist">${S.historyItems.map((it, i) => `<li id="history-item-${i}" data-act="load" data-index="${i}" class="${i === S.selectedHistoryIndex ? 'sel' : ''}"><span><span class="d">${esc(it.domain)}</span><div class="t">${esc(fmtDate(it.timestamp))}</div></span>${ic('chevron-right', 'ic-chev')}</li>`).join('')}</ul>`
                            : `<div class="hlist-empty">${ic('history')}${S.historySearch || n ? 'No matches' : 'Log empty'}</div>`}
                    </div>
                    ${when(S.historyItems.length && S.historyItems.length < S.historyTotal, () => `<div class="modal-foot"><button class="link" data-act="loadMore">Load more <span class="dim">(${S.historyItems.length} of ${S.historyTotal})</span></button></div>`)}`,
                    `<button class="icon-btn sm" data-act="exportHistory" ${S.historyItems.length ? '' : 'disabled'} title="Export log">${ic('download')}</button><button class="icon-btn sm" data-act="importHistory" title="Import log">${ic('upload')}</button>`);
            }

            if (S.versionsOpen) {
                html += modal('versions', '', `${ic('clock', 'dim')} Snapshots <code class="dim">${esc(S.domain)}</code>`, `
                    <ul class="hlist scroll" style="max-height:60vh;overflow-y:auto">${S.domainVersions.map((it, i) => {
                        const cur = it.timestamp == r.timestamp;
                        return `<li id="version-item-${i}" data-act="loadVersion" data-index="${i}" class="${cur ? 'cur' : ''} ${i === S.selectedIndex ? 'sel' : ''}">
                            <span style="display:inline-flex;align-items:center;gap:10px">${ic(cur ? 'check-circle' : 'clock', cur ? 'accent' : 'faint')}<span class="d" style="font-family:var(--font-sans);font-weight:500">${esc(fmtDate(it.timestamp))}</span></span>
                            <button class="icon-btn sm danger hover-only" data-act="deleteVersion" data-index="${i}" title="Delete snapshot">${ic('trash')}</button></li>`;
                    }).join('')}</ul>`);
            }

            if (S.helpOpen) {
                const code = v => `<code style="color:var(--text)">${esc(v)}</code>`;
                html += modal('help', 'sm', 'Help', `<div class="modal-body scroll">
                    <div class="help-section"><h4>Keyboard</h4>
                        <div class="kbd-row"><span>Focus search</span><kbd>/</kbd></div>
                        <div class="kbd-row"><span>Scan log</span><span class="kbds"><kbd>⌘</kbd><kbd>K</kbd></span></div>
                        <div class="kbd-row"><span>Navigate lists</span><span class="kbds"><kbd>↑</kbd><kbd>↓</kbd></span></div>
                        <div class="kbd-row"><span>Select item</span><kbd>Enter</kbd></div>
                        <div class="kbd-row"><span>Close</span><kbd>Esc</kbd></div>
                        <div class="kbd-row"><span>This panel</span><kbd>?</kbd></div>
                        <p class="dim small" style="margin-top:10px">Right-click any IP, hostname or value for dig, whois, scan and copy.</p></div>
                    ${when(S.localMode || S.reportMode, () => `<div class="help-section"><h4>Command line</h4>
                        <div class="cmd-l">Scan a domain</div><code class="cmd scroll">php ~/.periscope/engine.php example.com</code>
                        <div class="cmd-l">Scan, then open the report here</div><code class="cmd scroll">php ~/.periscope/engine.php example.com --open</code>
                        <div class="cmd-l">Start the bridge</div><code class="cmd scroll">${esc(INSTALL_CMD)}</code>
                        <div class="cmd-l">Reprocess stored scans after an update</div><code class="cmd scroll">php ~/.periscope/engine.php action=bulk_upgrade</code></div>`)}
                    ${when(S.bridgeHasDb, () => `<div class="help-section"><h4>Database</h4>
                        <div class="kbd-row"><span>Path</span><code class="small break" style="text-align:right;color:var(--text)">${esc(S.dbInfo.path)}</code></div>
                        <div class="kbd-row"><span>Size</span>${code(formatBytes(S.dbInfo.size))}</div>
                        <div class="kbd-row"><span>Stored scans</span>${code(S.dbInfo.scanCount.toLocaleString())}</div></div>`)}
                    ${when(S.localMode && S.scansInfo.path, () => `<div class="help-section"><h4>Raw data</h4>
                        <div class="kbd-row"><span>Path</span><code class="small break" style="text-align:right;color:var(--text)">${esc(S.scansInfo.path)}</code></div>
                        <div class="kbd-row"><span>Storage</span>${code(formatBytes(S.scansInfo.size))}</div></div>`)}
                    <div class="help-section" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
                        <a href="https://github.com/austinginder/periscope/releases" target="_blank" rel="noopener" class="link small">${ic('tag')} Periscope ${VERSION}</a>
                        ${when(S.serverVersion && S.serverVersion !== VERSION, () => `<span class="tag tag-warn" title="The bridge and the UI are on different versions">bridge ${esc(S.serverVersion)}</span>`)}
                    </div></div>`);
            }

            const og = mt.open_graph, tw = mt.twitter;
            if (S.ogOpen && og) {
                const src = D.ogImage();
                html += modal('og', '', 'Open Graph', `<div class="modal-body">
                    <div class="preview-card"><div class="preview-img">${src && !S.imgFailed.og ? `<img src="${esc(src)}" alt="" data-img="og">` : ic('image-off', 'ic-xl')}</div>
                        <div class="preview-txt"><div class="u">${esc(S.domain)}</div><h4>${esc(decodeEntities(og.title || mt.basic?.title || 'No title'))}</h4>${when(og.description, () => `<p>${esc(decodeEntities(og.description))}</p>`)}</div></div>
                    <div class="rows" style="margin-top:14px">
                        ${when(og.type, () => kvRow('<span class="mono">og:type</span>', esc(og.type)))}
                        ${when(og.image, () => kvRow('<span class="mono">og:image</span>', `<span class="truncate" style="max-width:100%;display:block" title="${esc(og.image)}">${esc(og.image)}</span>`, ' style="max-width:60%"'))}
                        ${when(og.image_hash, () => kvRow('Stored copy', `${esc((og.image_extension || '').toUpperCase())} · ${formatBytes(og.image_size)}`))}
                    </div></div>`);
            }
            if (S.twOpen && tw) {
                const src = D.twitterImage();
                html += modal('tw', '', 'Twitter card', `<div class="modal-body">
                    <div class="preview-card round"><div class="preview-img">${src && !S.imgFailed.tw ? `<img src="${esc(src)}" alt="" data-img="tw">` : ic('image-off', 'ic-xl')}</div>
                        <div class="preview-txt"><div class="u" style="text-transform:none;letter-spacing:0">${esc(S.domain)}</div><h4 style="font-weight:500">${esc(decodeEntities(tw.title || og?.title || mt.basic?.title || 'No title'))}</h4></div></div>
                    <div class="rows" style="margin-top:14px">
                        ${when(tw.card, () => kvRow('<span class="mono">twitter:card</span>', esc(tw.card)))}
                        ${when(tw.site, () => kvRow('<span class="mono">twitter:site</span>', esc(tw.site)))}
                        ${tw.image_hash ? kvRow('Stored copy', `${esc((tw.image_extension || '').toUpperCase())} · ${formatBytes(tw.image_size)}`) : og?.image_hash ? kvRow('Stored copy (from OG)', `${esc((og.image_extension || '').toUpperCase())} · ${formatBytes(og.image_size)}`) : ''}
                    </div></div>`);
            }
            const fav = r.metadata?.favicon;
            if (S.favOpen && fav && fav.present) {
                const src = D.favicon();
                html += modal('fav', 'sm', 'Favicon', `<div class="modal-body">
                    ${when(src, () => `<div class="favicons">${[16, 32, 64].map(s => `<div><img src="${esc(src)}" alt="" width="${s}" height="${s}" data-img="fav"><span>${s}</span></div>`).join('')}</div>`)}
                    <div class="rows" style="margin-top:14px;border-top:1px solid var(--line);padding-top:6px">
                        ${when(fav.source, () => kvRow('Source', esc(fav.source)))}
                        ${when(fav.extension, () => kvRow('Format', `<span style="text-transform:uppercase">${esc(fav.extension)}</span>`))}
                        ${when(fav.hash, () => kvRow('MD5', `<span class="break"${ctxAttr(fav.hash)}>${esc(fav.hash)}</span>`))}
                        ${when(fav.size, () => kvRow('Size', formatBytes(fav.size)))}
                    </div></div>`);
            }
            const cms = r.cms && !Array.isArray(r.cms) ? r.cms : null;
            if (S.pluginsOpen && cms && cms.plugins && cms.plugins.length) {
                html += modal('plugins', 'sm', `${ic('puzzle', 'dim')} WordPress plugins <span class="tag mono">${cms.plugins.length}</span>`, `<div class="modal-body scroll">
                    <p class="dim small" style="margin-bottom:10px">Detected from asset paths in the HTML source.</p>
