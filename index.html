                    <ul class="plugin-list">${cms.plugins.map(p => { const n = getPluginName(p); return `<li>${ic('box')}<span style="min-width:0"><div class="n" title="${esc(n || p)}">${esc(n || p)}</div>${n ? `<div class="s">${esc(p)}</div>` : ''}</span></li>`; }).join('')}</ul></div>`);
            }

            // Re-renders while a modal is open (history pages arriving, arrow-key selection) must not
            // replay the pop-in animation or steal the caret from the search box.
            const before = new Set([...document.querySelectorAll('#modals [data-modal]')].map(m => m.dataset.modal));
            const search = $('#historySearch');
            const hadFocus = !!search && document.activeElement === search;
            const caret = hadFocus ? [search.selectionStart, search.selectionEnd] : null;
            const listScroll = $('#historyList')?.scrollTop || 0;
            $('#modals').innerHTML = html;
            document.querySelectorAll('#modals [data-modal]').forEach(m => { if (before.has(m.dataset.modal)) $('.modal', m).style.animation = 'none'; });
            const input = $('#historySearch');
            if (input && (hadFocus || (S.historyOpen && !before.has('history')))) { input.focus(); const [a, b] = caret || [input.value.length, input.value.length]; try { input.setSelectionRange(a, b); } catch (e) { } }
            if (listScroll && $('#historyList')) $('#historyList').scrollTop = listScroll;
        }

        const anyModalOpen = () => S.dialog.show || S.historyOpen || S.versionsOpen || S.helpOpen || S.ogOpen || S.twOpen || S.favOpen || S.pluginsOpen;
        function closeModal(key) {
            const map = { dialog: () => S.dialog.show = false, history: () => S.historyOpen = false, versions: () => S.versionsOpen = false, help: () => S.helpOpen = false, og: () => S.ogOpen = false, tw: () => S.twOpen = false, fav: () => S.favOpen = false, plugins: () => S.pluginsOpen = false };
            if (key && map[key]) map[key](); else Object.values(map).forEach(fn => fn());
            renderModals();
        }

        // ---- full render ----
        function render() { renderTopbar(); renderHero(); renderStates(); renderResults(); renderCtx(); renderModals(); renderToast(); }

        // ------------------------------------------------------------------
        // Actions
        // ------------------------------------------------------------------
        const A = {
            setUrl(mutate, replace) {
                const u = new URL(window.location);
                mutate(u.searchParams);
                history[replace ? 'replaceState' : 'pushState']({}, '', u);
            },
            reset() {
                if (S.reportMode) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
                S.response = emptyResponse(); S.domain = ''; S.domainVersions = []; S.showMissingMeta = false;
                $('#scanInput').value = '';
                A.setUrl(p => p.delete('domain'));
                render();
                $('#scanInput').focus();
            },
            systemTheme() { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; },
            setTheme(pref) {
                // pref: 'system' | 'light' | 'dark'. data-theme = effective mode, data-theme-pref = preference.
                S.themePref = pref;
                S.theme = pref === 'system' ? A.systemTheme() : pref;
                try { if (pref === 'system') localStorage.removeItem('theme'); else localStorage.setItem('theme', pref); } catch (e) { }
                document.documentElement.setAttribute('data-theme', S.theme);
                document.documentElement.setAttribute('data-theme-pref', pref);
                S.themeMenu.show = false; renderThemeMenu(); renderTopbar();
            },
            toggleTheme() { A.setTheme(S.theme === 'light' ? 'dark' : 'light'); },
            copy(text, msg) {
                return navigator.clipboard.writeText(text).then(() => showToast(msg || 'Copied to clipboard'), () => showToast('Copy failed'));
            },
            copyValue(el) {
                const v = String(el.dataset.ctx).trim();
                const short = v.length > 48 ? v.slice(0, 45) + '…' : v;
                A.copy(v, `Copied ${short}`).then(() => { el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 700); });
            },
            downloadZone() {
                const blob = new Blob([S.response.zone], { type: 'text/dns' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `${S.domain}.txt`; a.click();
                URL.revokeObjectURL(url);
            },
            stopScan() {
                if (S.es) { S.es.close(); S.es = null; }
                S.loading = false; S.progress = { step: 0, total: 7, percent: 0, message: '', detail: '' };
                render();
            },
            scan() {
                S.domain = normalizeDomain($('#scanInput').value || S.domain);
                $('#scanInput').value = S.domain;
                if (!S.domain) return;
                S.dnsServer = ($('#dnsInput').value || '').trim();
                if (S.es) { S.es.close(); S.es = null; }
                S.loading = true; S.loadingText = 'Scanning…'; S.loadingFromHistory = false; S.acOpen = false; S.acItems = [];
                S.progress = { step: 0, total: 7, percent: 0, message: 'Initializing…', detail: '' };
                S.response = emptyResponse(); S.showMissingMeta = false;
                A.setUrl(p => { p.set('domain', S.domain); if (S.dnsServer) p.set('dns_server', S.dnsServer); else p.delete('dns_server'); });
                render();

                let params = `scan=${encodeURIComponent(S.domain)}`;
                if (S.dnsServer) params += `&dns_server=${encodeURIComponent(S.dnsServer)}`;
                const fail = html => { S.loading = false; S.progress = { step: 0, total: 7, percent: 0, message: '', detail: '' }; S.response.errors.push(html); render(); };
                const netFail = () => fail(`<strong>Network connection failed</strong><br><span class="dim">Could not connect to ${esc(S.localMode ? BRIDGE : window.location.origin)}</span><br><button class="link" style="margin-top:6px" data-act="scan">Retry</button>`);

                if (typeof EventSource !== 'undefined') {
                    const es = new EventSource(getUrl(params));
                    S.es = es;
                    es.onmessage = ev => {
                        let payload;
                        try { payload = JSON.parse(ev.data); } catch (e) { es.close(); S.es = null; fail(`<strong>Server error</strong><br><span class="dim">${esc(ev.data)}</span>`); return; }
                        if (payload.type === 'progress') {
                            S.progress = { step: payload.step, total: payload.total, percent: payload.percent, message: payload.message, detail: payload.detail || '' };
                            renderProgress();
                        } else if (payload.type === 'complete') {
                            es.close(); S.es = null; S.loading = false;
                            S.progress = { step: 0, total: 7, percent: 0, message: '', detail: '' };
                            const data = payload.data;
                            if (data.errors && data.errors.length) { S.response.errors = data.errors; render(); }
                            else { A.applyResponse(data); A.loadHistory(); A.getDomainVersions(S.domain); }
                        } else if (payload.type === 'error') {
                            es.close(); S.es = null; fail(`<strong>Scan error</strong><br><span class="dim">${esc(payload.message)}</span>`);
                        }
                    };
                    es.onerror = () => { es.close(); S.es = null; netFail(); };
                } else {
                    fetch(getUrl(params.replace(/^scan=/, 'domain='))).then(r => r.text()).then(text => {
                        let data; try { data = JSON.parse(text); } catch (e) { fail(`<strong>Server error</strong><br><span class="dim">${esc(text)}</span>`); return; }
                        S.loading = false; S.progress = { step: 0, total: 7, percent: 0, message: '', detail: '' };
                        if (data.errors && data.errors.length) { S.response.errors = data.errors; render(); }
                        else { A.applyResponse(data); A.saveToHistory(S.domain, data); A.getDomainVersions(S.domain); }
                    }).catch(netFail);
                }
            },
            applyResponse(data) {
                if (!data.errors) data.errors = [];
                if (!data.ip_lookup) data.ip_lookup = {};
                S.response = data; S.imgFailed = { og: false, tw: false }; S.showMissingMeta = false;
                render();
            },

            // ---- bridge ----
            applyStatus(data) {
                S.bridgeConnected = true; S.bridgeHasDb = !!data.has_db; S.serverVersion = data.plugin_version || null;
                if (data.has_db) S.dbInfo = { path: data.db_path || '', size: data.db_size || 0, scanCount: data.scan_count || 0 };
                S.scansInfo = { path: data.scans_path || '', size: data.scans_size || 0 };
            },
            checkBridge() {
                S.bridgeConnected = null; render();
                fetch(getUrl('action=check_status')).then(r => r.json()).then(data => {
                    A.applyStatus(data); render();
                    A.loadHistory().then(() => { if (S.pendingDeepLink) { A.deepLink(S.pendingDeepLink); S.pendingDeepLink = null; } });
                }).catch(() => { S.bridgeConnected = false; S.pendingDeepLink = null; render(); });
            },
            detectBridge() {
                fetch(BRIDGE + '/engine.php?action=check_status', { mode: 'cors' }).then(r => r.json()).then(data => {
                    S.localMode = true; A.applyStatus(data);
                    A.setUrl(p => p.set('local', 'true'), true);
                    render();
                    A.loadHistory().then(() => { if (S.pendingDeepLink) { A.deepLink(S.pendingDeepLink); S.pendingDeepLink = null; } });
                }).catch(() => { /* no bridge, stay on the landing */ });
            },
            deepLink(domain) {
                // Prefer the newest stored scan for this exact host; only scan when none exists.
                const fresh = () => { S.domain = domain; $('#scanInput').value = domain; A.scan(); };
                const cached = S.historyItems.find(i => i.domain.toLowerCase() === domain.toLowerCase());
                if (cached) { A.loadFromHistory(cached); return; }
                if (!S.bridgeHasDb) { fresh(); return; }
                fetch(getUrl(`action=get_domain_versions&domain=${encodeURIComponent(domain)}`)).then(r => r.json())
                    .then(list => { const newest = Array.isArray(list) && list.length ? list.reduce((a, b) => (+a.timestamp >= +b.timestamp ? a : b)) : null; newest ? A.loadFromHistory({ ...newest, domain }) : fresh(); })
                    .catch(fresh);
            },

            // ---- history ----
            readLocal() { try { return JSON.parse(localStorage.getItem('periscope_history') || '[]'); } catch (e) { return []; } },
            writeLocal(items) { try { localStorage.setItem('periscope_history', JSON.stringify(items)); } catch (e) { } },
            loadHistory(append) {
                const f = S.historyFilters;
                if (S.bridgeHasDb) {
                    const offset = append ? S.historyItems.length : 0, limit = append ? 50 : S.historyLimit;
                    let p = `action=get_history&offset=${offset}&limit=${limit}`;
                    if (S.historySearch) p += `&search=${encodeURIComponent(S.historySearch)}`;
                    if (f.existence !== 'all') p += `&existence=${f.existence}`;
                    if (f.platform !== 'all') p += `&platform=${encodeURIComponent(f.platform)}`;
                    if (f.scanCount !== 'all') p += `&scan_count=${encodeURIComponent(f.scanCount)}`;
                    if (f.indexability !== 'all') p += `&indexability=${encodeURIComponent(f.indexability)}`;
                    return fetch(getUrl(p)).then(r => r.json()).then(data => {
                        if (append) { S.historyItems = [...S.historyItems, ...data.items]; S.historyLimit = S.historyItems.length; }
                        else S.historyItems = data.items;
                        S.historyTotal = data.total;
                        if (S.historyOpen) renderModals();
                    }).catch(() => { });
                }
                let items = A.readLocal();
                if (S.historySearch) items = items.filter(i => i.domain.toLowerCase().includes(S.historySearch.toLowerCase()));
                if (f.existence === 'exists') items = items.filter(i => i.data && i.data.domain_exists !== false);
                else if (f.existence === 'nonexistent') items = items.filter(i => i.data && i.data.domain_exists === false);
                if (f.platform !== 'all') items = items.filter(i => i.data && i.data.cms && i.data.cms.name === f.platform);
                if (f.scanCount !== 'all') {
                    const counts = {}; items.forEach(i => counts[i.domain] = (counts[i.domain] || 0) + 1);
                    items = items.filter(i => A.matchesScanCount(counts[i.domain], f.scanCount));
                }
                if (f.indexability !== 'all') items = items.filter(i => { const b = i.data && i.data.indexability && i.data.indexability.blocked; return f.indexability === 'hidden' ? b === true : b !== true; });
                S.historyItems = items; S.historyTotal = items.length;
                if (S.historyOpen) renderModals();
                return Promise.resolve();
            },
            matchesScanCount(count, fv) {
                if (/^\d+$/.test(fv)) return count === parseInt(fv);
                const range = fv.match(/^(\d+)-(\d+)$/); if (range) return count >= +range[1] && count <= +range[2];
                const plus = fv.match(/^(\d+)\+$/); if (plus) return count >= +plus[1];
                return true;
            },
            loadFilterOptions() {
                if (S.bridgeHasDb) {
                    fetch(getUrl('action=get_platforms')).then(r => r.json()).then(d => { S.availablePlatforms = d; if (S.historyOpen) renderModals(); }).catch(() => { });
                    fetch(getUrl('action=get_scan_counts')).then(r => r.json()).then(d => { S.scanCountOptions = d; if (S.historyOpen) renderModals(); }).catch(() => { });
                    return;
                }
                const items = A.readLocal(), platforms = new Set(), counts = {};
                items.forEach(i => { if (i.data && i.data.cms && i.data.cms.name) platforms.add(i.data.cms.name); counts[i.domain] = (counts[i.domain] || 0) + 1; });
                S.availablePlatforms = [...platforms].sort();
                S.scanCountOptions = A.buildScanCountOptions(Object.values(counts));
            },
            buildScanCountOptions(counts) {
                if (!counts.length) return [];
                const dist = {}; counts.forEach(c => dist[c] = (dist[c] || 0) + 1);
                const uniq = Object.keys(dist).map(Number).sort((a, b) => a - b), options = [];
                if (uniq.length <= 5) {
                    uniq.forEach(c => options.push({ value: String(c), label: `${plural(c, 'scan')} (${plural(dist[c], 'domain')})` }));
                    return options;
                }
                const max = Math.max(...uniq), ranges = [];
                if (dist[1]) ranges.push({ min: 1, max: 1, label: '1 scan' });
                const mid = Math.min(5, Math.floor(max / 2));
                if (mid > 1) ranges.push({ min: 2, max: mid, label: `2-${mid} scans` });
                if (max > mid) ranges.push({ min: mid + 1, max, label: `${mid + 1}+ scans` });
                ranges.forEach(rg => {
                    let n = 0; for (let i = rg.min; i <= rg.max; i++) n += dist[i] || 0;
                    if (n) options.push({ value: rg.min === rg.max ? String(rg.min) : `${rg.min}-${rg.max}`, label: `${rg.label} (${plural(n, 'domain')})` });
                });
                return options;
            },
            openHistory() {
                if (S.reportMode) return;
                S.historyOpen = true; S.selectedHistoryIndex = -1; S.historySearch = '';
                S.historyFilters = { existence: 'all', platform: 'all', scanCount: 'all', indexability: 'all' };
                renderModals();
                A.loadHistory().then(() => {
                    if (S.domain && S.response.timestamp) {
                        const ts = parseInt(S.response.timestamp);
                        let idx = S.historyItems.findIndex(i => i.domain === S.domain && parseInt(i.timestamp) === ts);
                        if (idx === -1) idx = S.historyItems.findIndex(i => i.domain === S.domain);
                        if (idx !== -1) { S.selectedHistoryIndex = idx; renderModals(); A.scrollTo('history-item-' + idx); }
                    }
                });
                A.loadFilterOptions();
            },
            scrollTo(id) { requestAnimationFrame(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ block: 'nearest' }); }); },
            getDomainVersions(domain) {
                if (S.bridgeHasDb) fetch(getUrl(`action=get_domain_versions&domain=${encodeURIComponent(domain)}`)).then(r => r.json()).then(d => { S.domainVersions = d; renderResults(); if (S.versionsOpen) renderModals(); }).catch(() => { });
                else { S.domainVersions = S.historyItems.filter(i => i.domain.toLowerCase() === domain.toLowerCase()); renderResults(); }
            },
            saveToHistory(domain, data) {
                if (S.bridgeHasDb) { fetch(getUrl('action=save_history'), { method: 'POST', body: JSON.stringify({ domain, data }) }).then(() => { A.loadHistory(); A.getDomainVersions(domain); }); return; }
                if (!data.timestamp) data.timestamp = Math.floor(Date.now() / 1000);
                const items = A.readLocal(); items.unshift({ domain, timestamp: data.timestamp, data }); if (items.length > 50) items.pop();
                A.writeLocal(items); S.historyItems = items; A.getDomainVersions(domain);
            },
            loadFromHistory(item) {
                S.domain = item.domain; $('#scanInput').value = item.domain;
                S.historyOpen = false; S.versionsOpen = false; S.acOpen = false;
                if (item.data) { A.finishLoad(item, item.data); return; }
                if (S.bridgeHasDb && item.id) {
                    S.loading = true; S.loadingText = 'Loading…'; S.loadingFromHistory = true; S.response = emptyResponse(); render();
                    fetch(getUrl(`action=get_history_item&id=${item.id}`)).then(r => r.json()).then(data => {
                        S.loading = false; S.loadingFromHistory = false;
                        A.finishLoad(item, data);
                        if (data.cache_status === 'regenerated') showToast('Cache updated for the new engine version');
                        else if (S.serverVersion && data.plugin_version && data.plugin_version !== S.serverVersion) A.regenerate(item.id, false);
                    }).catch(() => { S.loading = false; S.loadingFromHistory = false; S.response.errors.push('<strong>Could not load that scan.</strong>'); render(); });
                } else render();
            },
            finishLoad(item, data) {
                if (!data.timestamp) data.timestamp = item.timestamp;
                A.applyResponse(data);
                A.getDomainVersions(item.domain);
                A.setUrl(p => p.set('domain', item.domain));
            },
            regenerate(id, manual) {
                if (manual) { S.refreshing = true; renderResults(); }
                fetch(getUrl(`action=regenerate_cache&id=${id}`)).then(r => r.json()).then(res => {
                    S.refreshing = false;
                    if (res.success && res.data) {
                        const changed = JSON.stringify(S.response) !== JSON.stringify(res.data);
                        if (changed || manual) { const ts = S.response.timestamp; A.applyResponse(res.data); if (!S.response.timestamp) S.response.timestamp = ts; }
                        showToast(manual ? 'Report refreshed' : (changed ? 'Scan data updated' : 'Already current'));
                    } else if (manual) showToast('Refresh failed');
                    renderResults();
                }).catch(() => { S.refreshing = false; if (manual) showToast('Refresh failed'); renderResults(); });
            },
            deleteVersion(index) {
                const item = S.domainVersions[index]; if (!item) return;
                const after = () => { if (S.domain === item.domain) A.getDomainVersions(S.domain); A.loadHistory(); showToast('Scan deleted'); };
                if (S.bridgeHasDb) { const fd = new FormData(); fd.append('id', item.id); fetch(getUrl('action=delete_history'), { method: 'POST', body: fd }).then(after); }
                else { const items = A.readLocal().filter(i => !(i.domain === item.domain && i.timestamp == item.timestamp)); A.writeLocal(items); S.historyItems = items; after(); }
            },
            exportHistory() { window.location.href = getUrl('action=export_history'); },
            exportReport() {
                if (!S.response.target_host || !S.response.timestamp) return;
                window.location.href = getUrl(`action=export_report&domain=${encodeURIComponent(S.response.target_host)}&timestamp=${S.response.timestamp}`);
            },
            importHistory(file) {
                if (!file) return;
                const fd = new FormData(); fd.append('importFile', file);
                fetch(getUrl('action=import_history'), { method: 'POST', body: fd }).then(r => r.json())
                    .then(d => { if (d.success) { showToast(`Imported ${d.count} items`); A.loadHistory(); } else showToast('Import failed'); })
                    .catch(() => showToast('Import failed'));
            },

            // ---- autocomplete ----
            autocomplete() {
                clearTimeout(S.acTimer);
                S.domain = $('#scanInput').value;
                if (!S.domain) { S.acItems = []; renderDropdown(); return; }
                if (!S.bridgeHasDb) { renderDropdown(); return; }
                S.acTimer = setTimeout(() => {
                    fetch(getUrl(`action=get_history&search=${encodeURIComponent(S.domain)}&limit=8`)).then(r => r.json()).then(data => {
                        const unique = [], seen = new Set();
                        for (const it of data.items) { if (!seen.has(it.domain)) { unique.push(it); seen.add(it.domain); } if (unique.length >= 8) break; }
                        S.acItems = unique; renderDropdown();
                    }).catch(() => { });
                }, 150);
            },

            // ---- dialogs ----
            openDialog(title) { S.dialog = { show: true, title, content: 'Loading…', tabs: null, activeTab: null }; S.ctx.show = false; renderCtx(); renderModals(); },
            setDialog(patch) { Object.assign(S.dialog, patch); renderModals(); },
            dig(domain) {
                A.openDialog(`Dig: ${domain}`);
                fetch(getUrl(`dig=${encodeURIComponent(domain)}`)).then(r => r.text()).then(d => A.setDialog({ content: d || 'No results.' })).catch(() => A.setDialog({ content: 'Request failed.' }));
            },
            whois(ip) {
                A.openDialog(`Whois: ${ip}`);
                fetch(getUrl(`action=get_raw&domain=${encodeURIComponent(S.domain)}&timestamp=${S.response.timestamp}&type=whois_ip_${ip}`)).then(r => r.text())
                    .then(d => A.setDialog({ content: (d && !d.includes('No raw data')) ? d : 'No WHOIS data stored for this IP.' })).catch(() => A.setDialog({ content: 'Request failed.' }));
            },
            rawWhois() {
                const display = S.response.is_subdomain ? S.response.root_domain : S.domain;
                A.openDialog(`Raw data: ${display}`);
                const finish = (whois, rdap) => {
                    const tabs = {};
                    if (whois) tabs['WHOIS'] = whois;
                    if (rdap) { try { tabs['RDAP'] = JSON.stringify(JSON.parse(rdap), null, 2); } catch (e) { tabs['RDAP'] = rdap; } }
                    if (Object.keys(tabs).length) A.setDialog({ tabs, activeTab: Object.keys(tabs)[0], content: '' });
                    else A.setDialog({ content: S.reportMode ? 'Not included in this exported report.' : 'No raw data stored for this scan.' });
                };
                if (S.reportMode) { const rf = S.embed?.rawFiles || {}; finish(rf.whois_domain, rf.rdap); return; }
                const base = `action=get_raw&domain=${encodeURIComponent(S.domain)}&timestamp=${S.response.timestamp}`;
                const ok = t => t && !t.includes('No raw data') ? t : '';
                Promise.all([fetch(getUrl(`${base}&type=whois_domain`)).then(r => r.text()), fetch(getUrl(`${base}&type=rdap`)).then(r => r.text())])
                    .then(([w, r]) => finish(ok(w), ok(r))).catch(() => A.setDialog({ content: 'Request failed.' }));
            },
            preview(type, title) {
                A.openDialog(title);
                if (S.reportMode) { A.setDialog({ content: (S.embed?.rawFiles || {})[type] || 'Not included in this exported report.' }); return; }
                fetch(getUrl(`action=get_raw&domain=${encodeURIComponent(S.domain)}&timestamp=${S.response.timestamp}&type=${type}`)).then(r => r.text())
                    .then(c => A.setDialog({ content: (c && !c.includes('No raw data')) ? c : 'No data stored for this scan. Re-scan to capture this file.' })).catch(() => A.setDialog({ content: 'Request failed.' }));
            },
        };

        // ------------------------------------------------------------------
        // Events (delegated) + boot
        // ------------------------------------------------------------------
        const acts = {
            reset: A.reset, theme: A.toggleTheme, help: () => { S.helpOpen = true; renderModals(); },
            history: A.openHistory, versions: () => { S.versionsOpen = true; S.selectedIndex = Math.max(0, S.domainVersions.findIndex(v => v.timestamp == S.response.timestamp)); renderModals(); A.scrollTo('version-item-' + S.selectedIndex); },
            plugins: () => { S.pluginsOpen = true; renderModals(); },
            og: () => { S.ogOpen = true; renderModals(); }, tw: () => { S.twOpen = true; renderModals(); }, fav: () => { S.favOpen = true; renderModals(); },
            preview: el => A.preview(el.dataset.type, el.dataset.title),
            rawWhois: A.rawWhois, whois: el => A.whois(el.dataset.ip),
            export: A.exportReport, refresh: () => { const id = D.currentHistoryId(); if (id && !S.refreshing) A.regenerate(id, true); },
            copyZone: () => A.copy(S.response.zone, 'Zone file copied'), downloadZone: A.downloadZone,
            copyInstall: () => A.copy(INSTALL_CMD, 'Command copied'),
            toggleAdvanced: () => { S.showAdvanced = !S.showAdvanced; renderHero(); if (S.showAdvanced) $('#dnsInput').focus(); },
            clearDns: () => { S.dnsServer = ''; $('#dnsInput').value = ''; renderHero(); },
            stop: A.stopScan, scan: A.scan, retryBridge: A.checkBridge,
            toggleMissing: () => { S.showMissingMeta = !S.showMissingMeta; renderResults(); },
            pick: el => { const it = S.acItems.concat(S.historyItems).find(i => i.domain === el.dataset.domain && (!el.dataset.id || String(i.id) === el.dataset.id)) || { domain: el.dataset.domain, timestamp: +el.dataset.ts, id: el.dataset.id || undefined }; S.acOpen = false; S.acItems = []; renderDropdown(); A.loadFromHistory(it); },
            close: el => closeModal(el.dataset.key), tab: el => A.setDialog({ activeTab: el.dataset.tab }),
            load: el => A.loadFromHistory(S.historyItems[+el.dataset.index]), loadMore: () => A.loadHistory(true),
            loadVersion: el => A.loadFromHistory(S.domainVersions[+el.dataset.index]), deleteVersion: el => A.deleteVersion(+el.dataset.index),
            clearFilters: () => { S.historyFilters = { existence: 'all', platform: 'all', scanCount: 'all', indexability: 'all' }; S.selectedHistoryIndex = -1; A.loadHistory(); },
            exportHistory: A.exportHistory, importHistory: () => $('#importFile').click(),
            dig: () => A.dig(S.ctx.value), whoisIp: () => A.whois(S.ctx.value),
            scanTarget: () => { S.ctx.show = false; renderCtx(); S.domain = S.ctx.value; $('#scanInput').value = S.domain; A.scan(); },
            copyValue: () => { S.ctx.show = false; renderCtx(); A.copy(S.ctx.value); },
            dismissToast: () => { S.toast.show = false; renderToast(); },
            copyCard: el => { const key = el.dataset.card, text = D.cardText(key); if (text) A.copy(text, 'Card copied as text'); else showToast('Nothing to copy'); },
            copyLink: () => A.copy(D.pageLink(), 'Report link copied'),
            toggleRow: el => { S.openRows[el.dataset.row] = !S.openRows[el.dataset.row]; renderResults(); },
            setTheme: el => A.setTheme(el.dataset.value),
        };

        document.addEventListener('click', e => {
            const t = e.target.closest('[data-act]');
            if (S.themeMenu.show && !e.target.closest('#themeMenu')) { S.themeMenu.show = false; renderThemeMenu(); }
            if (!t) {
                if (S.ctx.show) { S.ctx.show = false; renderCtx(); }
                // Click-to-copy on any value. A drag-selection click is left alone so text selection still works.
                const c = e.target.closest('[data-ctx]');
                if (c && !e.target.closest('a') && !(window.getSelection && String(window.getSelection()).length)) A.copyValue(c);
                return;
            }
            if (t.tagName === 'A' && t.dataset.act === 'reset') e.preventDefault();
            const fn = acts[t.dataset.act];
            if (fn) { e.preventDefault(); fn(t, e); }
            if (S.ctx.show && !t.closest('.ctx')) { S.ctx.show = false; renderCtx(); }
        });
        document.addEventListener('mousedown', e => {
            // autocomplete picks fire on mousedown so the input's blur does not swallow them
            const li = e.target.closest('#dropdown [data-act="pick"]'); if (li) { e.preventDefault(); acts.pick(li); }
        });
        document.addEventListener('contextmenu', e => {
            const tb = e.target.closest('[data-theme-menu]');
            if (tb) { e.preventDefault(); const r = tb.getBoundingClientRect(); S.themeMenu = { show: true, x: r.right - 200, y: r.bottom + 6 }; renderThemeMenu(); return; }
            const t = e.target.closest('[data-ctx]');
            if (!t) return;
            e.preventDefault();
            S.ctx = { show: true, x: e.clientX, y: e.clientY, value: String(t.dataset.ctx).trim().split('\n')[0].trim() };
            renderCtx();
        });
        document.addEventListener('mouseleave', e => { if (e.target && e.target.classList && e.target.classList.contains('ctx')) { S.ctx.show = false; renderCtx(); } }, true);
        document.addEventListener('change', e => {
            if (e.target.id === 'importFile') { A.importHistory(e.target.files[0]); e.target.value = ''; }
            else if (e.target.dataset.filter) { S.historyFilters[e.target.dataset.filter] = e.target.value; S.selectedHistoryIndex = -1; A.loadHistory(); }
        });
        document.addEventListener('input', e => {
            if (e.target.id === 'scanInput') { S.acOpen = true; A.autocomplete(); }
            else if (e.target.id === 'dnsInput') { S.dnsServer = e.target.value.trim(); $('#dnsClear').hidden = !S.dnsServer; }
            else if (e.target.id === 'historySearch') { S.historySearch = e.target.value; S.selectedHistoryIndex = -1; clearTimeout(S.searchTimer); S.searchTimer = setTimeout(() => A.loadHistory(), 300); }
        });
        document.addEventListener('focusin', e => { if (e.target.id === 'scanInput') { S.acOpen = true; A.autocomplete(); } });
        document.addEventListener('focusout', e => { if (e.target.id === 'scanInput') setTimeout(() => { S.acOpen = false; renderDropdown(); }, 150); });
        document.addEventListener('error', e => {
            const img = e.target; if (!img || !img.dataset || !img.dataset.img) return;
            if (img.dataset.img === 'og') S.imgFailed.og = true; else if (img.dataset.img === 'tw') S.imgFailed.tw = true; else { img.style.visibility = 'hidden'; return; }
            renderModals();
        }, true);
        $('#scanForm').addEventListener('submit', e => { e.preventDefault(); A.scan(); });
        window.addEventListener('popstate', () => {
            if (S.reportMode) return;
            const d = normalizeDomain(new URLSearchParams(location.search).get('domain') || '');
            if (!d) { if (S.response.timestamp) { S.response = emptyResponse(); S.domain = ''; $('#scanInput').value = ''; render(); } return; }
            if (d !== S.domain || !S.response.timestamp) { S.domain = d; $('#scanInput').value = d; const cached = S.historyItems.find(i => i.domain.toLowerCase() === d); if (cached) A.loadFromHistory(cached); else A.scan(); }
        });

        document.addEventListener('keydown', e => {
            const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
            if (e.key === 'Escape') {
                if (S.ctx.show) { S.ctx.show = false; renderCtx(); }
                if (S.themeMenu.show) { S.themeMenu.show = false; renderThemeMenu(); }
                if (S.acOpen) { S.acOpen = false; renderDropdown(); }
                if (anyModalOpen()) closeModal();
                return;
            }
            if (e.key === '/' && !inField) { e.preventDefault(); $('#scanInput')?.focus(); return; }
            if (e.key === '?' && !inField) { e.preventDefault(); S.helpOpen = true; renderModals(); return; }
            if (e.key === 'k' && (e.metaKey || e.ctrlKey) && !S.reportMode) { e.preventDefault(); A.openHistory(); return; }
            const nav = (listKey, idxKey, prefix) => {
                const list = S[listKey]; if (!list.length) return false;
                if (e.key === 'ArrowDown') { e.preventDefault(); S[idxKey] = (S[idxKey] + 1) % list.length; }
                else if (e.key === 'ArrowUp') { e.preventDefault(); S[idxKey] = S[idxKey] <= 0 ? list.length - 1 : S[idxKey] - 1; }
                else if (e.key === 'Enter') { e.preventDefault(); if (S[idxKey] > -1) A.loadFromHistory(list[S[idxKey]]); return true; }
                else return false;
                renderModals(); A.scrollTo(prefix + S[idxKey]); return true;
            };
            if (S.versionsOpen) nav('domainVersions', 'selectedIndex', 'version-item-');
            else if (S.historyOpen) nav('historyItems', 'selectedHistoryIndex', 'history-item-');
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.themePref === 'system') A.setTheme('system'); });

        // ---- boot ----
        (function boot() {
            $('#app').hidden = false;
            if (S.reportMode) {
                const d = (S.embed && S.embed.data) || {};
                S.domain = d.target_host || (S.embed && S.embed.domain) || '';
                document.title = 'Periscope report: ' + S.domain;
                A.applyResponse(d);
                return;
            }
            const params = new URLSearchParams(location.search);
            const domainParam = params.get('domain');
            if (domainParam) { S.domain = normalizeDomain(domainParam); S.pendingDeepLink = S.domain; $('#scanInput').value = S.domain; }
            const dns = params.get('dns_server');
            if (dns) { S.dnsServer = dns; S.showAdvanced = true; $('#dnsInput').value = dns; }
            render();
            if (params.has('local')) { S.localMode = true; A.checkBridge(); }
            else { A.loadHistory(); A.detectBridge(); }
        })();
    </script>
</body>

</html>
